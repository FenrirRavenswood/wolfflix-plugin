name: Version de l'extension

# Une nouvelle version : changer le numéro dans version.txt (X.Y.Z) et pousser sur main.
# Construit la DLL pour Jellyfin 12 (.NET 10), publie le zip (tag vX.Y.Z), met à jour manifest.json.
on:
  push:
    branches: [main]
    paths: ['version.txt']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Numéro de version
        id: v
        run: |
          V="$(tr -d '[:space:]' < version.txt)"
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version.txt invalide : $V"; exit 1; }
          echo "court=$V" >> "$GITHUB_OUTPUT"
          echo "long=$V.0" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - name: Construction
        run: |
          set -o pipefail
          dotnet publish Jellyfin.Plugin.WolfFlix/Jellyfin.Plugin.WolfFlix.csproj -c Release -o sortie \
            -p:Version=${{ steps.v.outputs.long }} -p:AssemblyVersion=${{ steps.v.outputs.long }} -p:FileVersion=${{ steps.v.outputs.long }} 2>&1 | tee construction.log

      - name: Zip
        id: zip
        run: |
          NOM="wolfflix_${{ steps.v.outputs.long }}.zip"
          (cd sortie && zip -j "../$NOM" Jellyfin.Plugin.WolfFlix.dll)
          echo "nom=$NOM" >> "$GITHUB_OUTPUT"
          echo "md5=$(md5sum "$NOM" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="${{ steps.v.outputs.tag }}"
          gh release create "$T" "${{ steps.zip.outputs.nom }}" --target main --title "WolfFlix $T" --notes-file changelog.txt || \
          gh release upload "$T" "${{ steps.zip.outputs.nom }}" --clobber

      - name: manifest.json
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          python3 .github/manifeste.py "${{ steps.v.outputs.long }}" "https://github.com/${{ github.repository }}/releases/download/${{ steps.v.outputs.tag }}/${{ steps.zip.outputs.nom }}" "${{ steps.zip.outputs.md5 }}"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add manifest.json
          git commit -m "manifest : ${{ steps.v.outputs.long }}" || exit 0
          git push origin main

      # En cas d'échec, le journal est poussé sur la branche « journaux » pour pouvoir le lire
      - name: Journal d'échec
        if: failure()
        run: |
          cp construction.log /tmp/construction.log 2>/dev/null || echo "pas de journal" > /tmp/construction.log
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan journaux
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/construction.log construction.log
          git add construction.log
          git commit -m "échec de construction ${{ steps.v.outputs.tag }}"
          git push -f origin journaux
